project_id = "grace-booth"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[storage.buckets.photos]
public = false
allowed_mime_types = ["image/jpeg"]

[auth]
enabled = true
site_url = "http://127.0.0.1:4173"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[functions.create-upload]
verify_jwt = true

[functions.confirm-upload]
verify_jwt = true

[functions.photo]
verify_jwt = false

[functions.repair-photo]
verify_jwt = true

[functions.cleanup-expired]
verify_jwt = false

[functions.sync-google-photos]
verify_jwt = false

[functions.google-photos-auth]
verify_jwt = false

[analytics]
enabled = false
port = 54327
backend = "postgres"
