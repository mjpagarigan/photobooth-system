packages:
  - apps/*
  - packages/*

catalog:
  '@fontsource-variable/inter': ^5.3.0
  '@types/node': 24.10.1
  lucide-react: 1.65.0
  typescript: 6.0.3
  vite: 7.3.6
  vitest: 4.1.10

catalogMode: strict

cleanupUnusedCatalogs: true

linkWorkspacePackages: true

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  deno: true
  electron: true
  electron-winstaller: true
  esbuild: true
  sharp: true

saveWorkspaceProtocol: rolling

sharedWorkspaceLockfile: true

minimumReleaseAgeExclude:
  - lucide-react@1.65.0
